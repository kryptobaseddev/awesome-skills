# .deluxui/ux.config.yaml -- project settings for the deluxui checks.
# Everything here is optional; the defaults come from
# references/rules/thresholds.yaml.

app:
  dev_url: http://localhost:5173
  # Routes worth auditing: the primary task, one dense data view, one form,
  # and every screen with an irreversible action.
  routes: ["/", "/settings"]
  # Glob against request URLs. WITHOUT THIS the aborted / empty / offline probes
  # never run, and they find more real defects than everything else combined.
  # Supabase: '**/rest/v1/**'   GraphQL: '**/graphql'
  api_pattern: "**/api/**"
  viewports: [320, 390, 768, 1024, 1440]

# Features the product actually has. Rules gated on a feature you do not declare
# report NOT_APPLICABLE. Declaring honestly is what keeps the matrix meaningful.
features:
  - forms
  # - authentication
  # - payments_or_legal
  # - destructive_actions
  # - charts
  # - tables
  # - uploads
  # - drag_interactions
  # - search_or_filter
  # - pagination
  # - bulk_actions
  # - modals
  # - i18n
  # - offline_or_drafts
  # - media
  # - ai_features
  # - measurement_program
  # - ios
  # - android

# Overrides for PROJECT-class thresholds only. STANDARD values come from WCAG and
# are not overridable -- a deviation is an exception record, not a config change.
thresholds:
  # target_size:
  #   web_coarse_min_px: 40        # dense internal tooling, recorded decision
  # typography:
  #   measure_ch_max: 90

# Turn a check off only when it genuinely does not apply to this project. It is
# not a way to silence a real finding: the rule still reports, now as NOT_RUN,
# which is exactly what it is.
disabled_checks: []
  # - S-CONTENT-I18N            # single-locale product, will not change
