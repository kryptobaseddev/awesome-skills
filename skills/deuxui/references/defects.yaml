    verified_by_revert: true
    revert_reverified: "2026-09-22"

  - id: DEF-21
    title: a word boundary before *ngFor can never match
    class: never-worked
    kind: product
    found_in: "5.12.0"
    fixed_in: "5.12.0"
    surface: scripts/jsxspan.py
    symptom: >-
      The character before `*` is a space, and two non-word characters have no boundary
      between them.
    consequence: >-
      Angular's repeat form was silently undetectable, so an edit to one row of a
      repeated list was reported as a local change.
    fix: >-
      A negative lookbehind, which works for every spelling and still refuses to match
      inside `data-v-format`.
    guard:
      - file: scripts/jsxspan.py
        text: "(?<![\\w-])(v-for|x-for|\\*ngFor|ng-repeat)"
    control:
      - file: scripts/selftest.py
        text: '"angular ngFor"'
    verified_by_revert: true
    revert_reverified: "2026-09-22"

  - id: DEF-22
    title: the repeat check required a strict ancestor, and v-for sits on the element
    class: never-worked
    kind: product
    found_in: "5.12.0"
    fixed_in: "5.12.0"
    surface: scripts/jsxspan.py
    symptom: >-
      `v-for`, `x-for` and `ng-repeat` are attributes of the element being repeated, not
      of an ancestor. Requiring a strict ancestor missed every Vue and Alpine case.
    consequence: >-
      Same as DEF-21, for three more frameworks: "wrapped the element" and "wrapped
      every row" are different changes and only one was asked for.
    fix: >-
      The element somebody picked is allowed to be the one carrying the attribute.
    guard:
      - file: scripts/jsxspan.py
        text: _ATTR_REPEAT.search(head)
    control:
      - file: scripts/selftest.py
        text: '"vue v-for"'
    verified_by_revert: true
    revert_reverified: "2026-09-22"

  - id: DEF-23
    title: a .forEach() was reported as a .map()
    class: wrong-result
    kind: product
    found_in: "5.12.0"
    fixed_in: "5.12.0"
