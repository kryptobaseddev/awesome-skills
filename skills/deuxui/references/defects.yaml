  - id: DEF-18
    title: a no-op slice made the prefix-anchor case look handled
    class: wrong-result
    kind: product
    found_in: "5.10.0"
    fixed_in: "5.10.0"
    surface: scripts/ux_live.py
    symptom: >-
      An element's text often spans more than one source string, so `locate` resolves on
      a progressively shorter prefix. The rewrite loop computed `after[:len(after)]` --
      which is `after` -- behind a conditional that made the case look handled.
    consequence: >-
      It would have half-rewritten every multi-string element, left the tail of the old
