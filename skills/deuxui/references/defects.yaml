  - id: DEF-16
    title: hue decided whether two greys matched
    class: wrong-result
    kind: product
    found_in: "5.9.0"
    fixed_in: "5.9.0"
    surface: scripts/comp_diff.py
    symptom: >-
      Hue is numerically unstable as chroma approaches zero. `#808080` and `#818080` are
