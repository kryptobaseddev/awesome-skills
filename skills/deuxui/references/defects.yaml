# Every defect this skill has shipped, and what would catch it again.
#
# Checked by `scripts/defects.py`, which resolves every citation below. Read that
# file's docstring for why this is data rather than a paragraph saying "all fixed".
#
# The short version: "sixteen defects, all fixed" is the same shape of sentence as
# "looks good". It is self-reported, it cannot be falsified, and it stays true in
# prose long after somebody has undone the line it describes. So each row carries
# the fix as a citation into the tree and the assertion that fails when the fix is
# reverted -- and a row with no such assertion says UNGUARDED rather than blending
# into a total.
#
# Writing this out found four things no release note had: two fixes whose control did
# not exist (DEF-19, DEF-25), one case where I was about to add a control that was
# already there (DEF-15), and a defect I created while doing it (DEF-33).
#
# On the number, settled by counting rather than by argument. Through the v5 notes I
# carried a running count in prose, and at v5.20.1 it read "sixteen defects". Three
# figures can actually be derived, and none of them is sixteen:
#
#   22   what the release notes' own counted claims add up to. There are exactly eleven
#        of them -- "Three bugs the controls caught" (5.1.0), "two defects in the
#        DETECTORS" (5.2.0), "Three defects found by doing this properly" (5.4.0), and
#        eight more -- and they sum to 22:
#          git log --format='%b' skills/deuxui | grep -inE \
#            '\b(a|one|two|three|four) (real |more )?(defect|bug|mistake)s?\b'
#   32   the product defects enumerated below.
#   50   with the control defects, which no release note ever counted.
#
# So "sixteen" was not a subset anyone can name, and it was not even consistent with
# the notes' own headlines. It was a number maintained by hand in prose, which is the
# argument for this file and the reason the count here is printed by a program.
#
# What can be checked, and is: every defect any v5 release note describes has a row
# here. Nothing was dropped to make a number smaller, and nothing was split to make one
# larger -- one row is one wrong behaviour with one fix.

scope: >-
  Every defect found in the v5 series, from the rename at 5.0.0 to now, in two
  populations: those that did something wrong to somebody's project, and those where a
  CONTROL could not fail. The second is a defect in this skill's own terms -- its first
  sentence is that a check which cannot fail its own negative case is a comment -- and
  leaving them out would be exactly the cosmetic accounting this file exists to stop.
  Earlier releases fixed defects too (v4.5.0 alone carried six field-reported detector
  defects) and they are deliberately out of scope rather than half-recorded: this file
  only claims what it checks.

# class: what kind of wrong it was. The distinction is not cosmetic -- a wrong
# result and a check that cannot fail need different kinds of control.
#
#   wrong-result   it ran and produced an answer that was not true
#   never-worked   the feature could not work at all, in any project
#   undetectable   a check that could not fail, or that skipped itself silently
#   dead-end       the output was correct and left somebody with nowhere to go
#   latent         reachable and not yet observed in the wild
#   drift          a stated number or claim that no longer matched the artifact

defects:
  - id: DEF-01
    title: the accept gate graded findings by a key a finding does not have
    class: undetectable
    kind: product
    found_in: "5.1.0"
    fixed_in: "5.1.0"
    surface: scripts/ux_live.py
    symptom: >-
      `accept` decided which findings were blocking by reading `finding["severity"]`.
      Severity is a property of the RULE, in the registry, not of a finding -- so the
      blocking list was empty every time.
    consequence: >-
      The gate accepted a variant putting grey on white at 1.98:1. A check that cannot
      fail is not a check, which is this skill's own first argument, sitting in the one
      place that decides whether a change reaches somebody's source.
    fix: >-
      `severity_of()` resolves each detector's severity from the registry, and the
      control asserts the two detectors that matter most are graded P0/P1.
    guard:
      - file: scripts/ux_live.py
        text: "def severity_of"
    control:
      - file: scripts/selftest.py
        text: "so nothing can be graded"
    verified_by_revert: true
    revert_reverified: "2026-09-22"

  - id: DEF-02
    title: the review chrome was themed from hardcoded hex, in the tool that finds hex
    class: wrong-result
    kind: product
    found_in: "5.2.0"
    fixed_in: "5.2.0"
    surface: scripts/ux_review.py
    symptom: >-
      The review page carried literal warm greys, and `ux_question.py` four more. The
      page also themed itself from the project under review.
    consequence: >-
      A project with a cool palette got a warm dark mode nobody chose, and a reviewer
      comparing two variants of their product could not tell which pixels were the tool.
      S-TOKEN-HEX calls a literal in a rule a token that escaped; this was that, in the
      tool that reports it.
    fix: >-
      The frame reads DeuxUI's own declared contract; the framed variants keep theirs.
      `selftest.py` then scans this skill's own review page with its own detectors.
    guard:
      - file: scripts/ux_review.py
        text: uxconfig.brand_contract()
    control:
      - file: scripts/selftest.py
        text: "deuxui's own review page violates deuxui's own contract"
    verified_by_revert: true
    revert_reverified: "2026-09-22"

  - id: DEF-03
    title: S-CONTRACT-FONT-AVAIL read a declared stack as one opaque face name
    class: wrong-result
    kind: product
    found_in: "5.2.0"
    fixed_in: "5.2.0"
    surface: scripts/fontindex.py
    symptom: >-
      `ui-sans-serif, system-ui, sans-serif` is a complete and honest declaration for a
      product that ships no webfont. It was reported as a missing typeface.
    consequence: >-
      A false positive on the most conservative possible declaration, which is how a
      detector teaches people to disable it.
    fix: >-
      The stack is read as CSS reads it: the first entry is the face whose availability
      matters, and a leading generic always renders.
    guard:
      - file: scripts/fontindex.py
        text: "def primary"
    control:
      - file: scripts/selftest.py
        text: "deuxui's own review page violates deuxui's own contract"
    verified_by_revert: true
    revert_reverified: "2026-09-22"

  - id: DEF-04
