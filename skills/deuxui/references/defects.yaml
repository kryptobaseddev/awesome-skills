  - id: DEF-13
    title: the archive --adopt created was detected as a new rival on the next run
    class: never-worked
    kind: product
    found_in: "5.8.0"
    fixed_in: "5.8.0"
    surface: scripts/uxconfig.py
    symptom: >-
      `migrate --adopt` archived the record somebody chose not to keep, and the next
