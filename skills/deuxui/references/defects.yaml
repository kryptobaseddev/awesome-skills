    fixed_in: "5.2.0"
    surface: scripts/ux_question.py
    symptom: >-
      It produced #26282b at lightness 0.224 -- a step the contract does not declare.
    consequence: >-
      The tool that refuses off-ramp colour emitted one, on its own page. Contrast was
