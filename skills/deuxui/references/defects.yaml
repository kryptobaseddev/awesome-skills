      whatever it is called. The name is the least reliable thing about a directory.
    guard:
      - file: scripts/uxconfig.py
        text: STATE_MARKERS
    control:
      - file: scripts/selftest.py
        text: legacy_state did not find a record under an arbitrary
    verified_by_revert: true
    revert_reverified: "2026-09-22"

  - id: DEF-12
    title: doctor said nothing when a second record sat beside the live one
    class: undetectable
    kind: product
    found_in: "5.6.0"
    fixed_in: "5.6.0"
    surface: scripts/doctor.py
    symptom: >-
      It reported "your records are in a directory this version cannot see" and had no
