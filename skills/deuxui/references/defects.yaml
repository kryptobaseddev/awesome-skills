    revert_reverified: "2026-09-22"

  - id: DEF-19
    title: a parity row was marked mapped while carrying a gap
    class: drift
    kind: product
    found_in: "5.10.0"
    fixed_in: "5.10.0"
    surface: scripts/parity.py
    symptom: >-
      I marked `comp-diff` mapped and left a `gap` on it. The checker refused the
      release, which is what it is for.
    consequence: >-
      A row reading as complete while something inside it says otherwise is how a
      coverage file rots into reassurance.
    fix: >-
      Both directions are refused: `mapped` with a gap, and `partial`/`absent` without
      one. The rule existed from 5.4.0; until now nothing exercised it, because with one
      matrix in the tree there was nothing to hand it that breaks the rule. `audit()`
      takes a matrix path now, and both refusals are asserted.
    guard:
      - file: scripts/parity.py
        text: "status is 'mapped' but a `gap` is recorded"
    control:
      - file: scripts/selftest.py
        text: a `mapped` row carrying a gap was accepted
      - file: scripts/selftest.py
        text: a `partial` row with no gap was accepted
    verified_by_revert: true
    revert_reverified: "2026-09-22"

  - id: DEF-20
    title: locate dead-ended on text that lives in data rather than markup
    class: dead-end
    kind: product
    found_in: "5.11.0"
    fixed_in: "5.11.0"
    surface: scripts/ux_live.py
    symptom: >-
      When an element's text is nowhere in any component, it reported "no anchor resolved
      to exactly one place in the source". True, and useless.
    consequence: >-
      It sent somebody grepping components for a string that was never in one. In a
      component app the text usually lives in a mapped constant, a translation catalogue
      or a fixture -- files `locate` does not search.
    fix: >-
      It names that file and line, and deliberately refuses to write there: the same row
      may render in three places and the key beside it may be what an icon map or an
