    surface: scripts/selftest.py
    symptom: >-
      `selftest.py` read no arguments at all, so `selftest.py --help` executed every
      group. `parity.py --deep` probes each cited script by asking it for help, and
      `selftest.py` is cited -- so the probe ran the suite. Latent until a group in the
