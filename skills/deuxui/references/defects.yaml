  - id: DEF-05
    title: "`show` bound a (ws, reason) tuple to one name, so its guard never fired"
    class: never-worked
    kind: product
    found_in: "5.4.0"
    fixed_in: "5.4.0"
    surface: scripts/ux_live.py
    symptom: >-
      Two call sites bound `cdp.connect_page()` -- which returns a pair -- to a single
      name. A tuple is always truthy, so the "no page is open" guard never fired and
      `ws.call` raised AttributeError on the next line.
    consequence: >-
      The headline feature of v5.1.0 was a traceback, in every project, and the failure
      surfaced as a stack trace rather than as the guard's message.
    fix: >-
      Unpacked at all three sites, plus an AST control over every script asserting that
      nobody binds `connect_page` to one name again.
    guard:
      - file: scripts/ux_live.py
        text: "ws, why = cdp.connect_page()"
    control:
      - file: scripts/selftest.py
        text: 'nm != "connect_page"'
    verified_by_revert: true
    revert_reverified: "2026-09-22"

  - id: DEF-06
    title: the review proxy stripped CSP headers but not a meta policy
    class: never-worked
    kind: product
    found_in: "5.4.0"
    fixed_in: "5.4.0"
    surface: scripts/ux_review.py
    symptom: >-
      A `<meta http-equiv="Content-Security-Policy">` sits in the body, so it survived
      a proxy that only rewrote headers. The browser then refused the inline overlay.
    consequence: >-
      The refusal was logged to the framed page's console, not to the terminal the
      reviewer was watching, so the feature quietly did not exist.
    fix: >-
      `strip_meta_csp` replaces the tag with a comment naming who removed it and why,
      in the framed copy only, and the operator is told once per variant.
    guard:
      - file: scripts/ux_review.py
        text: "def strip_meta_csp"
    control:
      - file: scripts/selftest.py
        text: a non-CSP meta tag was rewritten
    verified_by_revert: true
    revert_reverified: "2026-09-22"

  - id: DEF-07
    title: an overlay's <style> is inline style whatever world created it
    class: never-worked
    kind: product
    found_in: "5.4.0"
    fixed_in: "5.4.0"
    surface: scripts/cdp.py
    symptom: >-
      Code run over CDP is exempt from the page's policy; what it appends to the
      document is not. Under `style-src 'self'` the highlight, badge and panel all
      appended successfully and rendered with nothing applied.
    consequence: >-
      It read as "the overlay is broken", in a page whose own console held the answer.
    fix: >-
      `style_policy` measures it -- inject a probe rule, read back whether it took
      effect, remove it -- and the callers refuse with the reason rather than drawing an
      invisible overlay. v5.21.0 added `--bypass-csp` as an opt-in, still measured.
    guard:
      - file: scripts/cdp.py
        text: "def style_policy"
    control:
      - file: scripts/selftest.py
        text: style_policy trusts the rule count without measuring the effect
    verified_by_revert: true
    revert_reverified: "2026-09-22"

  - id: DEF-08
    title: coupled() searched only the files locate() had already proved unique
    class: undetectable
    kind: product
    found_in: "5.4.0"
    fixed_in: "5.4.0"
    surface: scripts/ux_live.py
    symptom: >-
      It reported every OTHER place a rewritten literal appears, while searching the
      same component sources `locate` had just proved held exactly one occurrence.
    consequence: >-
      It could only ever report nothing. Very nearly dead code -- and the commonest
      coupling there is, an `en.json` keyed on the English string, was invisible to it.
    fix: >-
      `COUPLED_EXT` searches wider than `locate` on purpose: data, translation and
      config files, which is where the same literal actually lives.
    guard:
      - file: scripts/ux_live.py
        text: COUPLED_EXT
    control:
      - file: scripts/selftest.py
        text: files locate() already proved unique
    verified_by_revert: true
    revert_reverified: "2026-09-22"

  - id: DEF-09
    title: the skill's own counts disagreed with its own registry
    class: drift
    kind: product
    found_in: "5.4.0"
    fixed_in: "5.4.0"
    surface: SKILL.md
    symptom: >-
      183 static checks against the shipped 184; "one of the 30 operations" two lines
      above "all thirty-five"; and "213 of the 235 rules have an automated detector; the
      other 21" -- two numbers that do not add up to 235, where the real split is 215
      and 20.
    consequence: >-
      A document that miscounts its own contents is not evidence of anything, and this
      one is the first thing an agent reads.
    fix: >-
      Corrected, and all six numbers are now recounted from the registry by a control.
      That control caught its own first version miscounting `static` as one engine
      rather than the tier -- a control enforcing its own miscount is worse than none.
    guard:
      - file: SKILL.md
        text: 215 of the 235 rules
    control:
      - file: scripts/selftest.py
        text: rules have an automated detector
    verified_by_revert: true
    revert_reverified: "2026-09-22"

  - id: DEF-10
    title: wrap moved the element's first child instead of the element
    class: wrong-result
    kind: product
    found_in: "5.5.0"
    fixed_in: "5.5.0"
    surface: scripts/jsxspan.py
    symptom: >-
      A `<section>`'s innerText begins with its first heading's text, so picking the
      section and asking to wrap it wrapped the `<h1>`.
    consequence: >-
      It applied cleanly and looked right in a diff. It moved something nobody named,
      which is the exact failure this write path exists to refuse.
    fix: >-
      The span is verified before any caller may write, including that the tag found in
      source agrees with the DOM tag the browser reported. A capitalised name is a
      component and still matches anything; a lowercase mismatch is provable and refuses.
    guard:
      - file: scripts/jsxspan.py
        text: in the browser was a <
    control:
      - file: scripts/selftest.py
        text: container picked, not its child
    verified_by_revert: true
    revert_reverified: "2026-09-22"

  - id: DEF-11
    title: a state directory was recognised by a remembered name, not by its contents
    class: wrong-result
    kind: product
    found_in: "5.6.0"
    fixed_in: "5.6.0"
    surface: scripts/uxconfig.py
    symptom: >-
      Detection matched one hardcoded directory name. A directory somebody copied or
      renamed by hand held every contract version, decision and note the project ever
      made, and nothing found it.
    consequence: >-
      The project read as one that had never declared anything, so every contract rule
      reported NOT_RUN -- which looks like a clean scan to anybody not paying attention.
