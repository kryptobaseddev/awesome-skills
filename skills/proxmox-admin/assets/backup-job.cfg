# proxmox-admin / asset: scheduled backup job template
# Drop into /etc/pve/jobs.cfg on the node (pmxcfs replicates cluster-wide).
# Edit placeholders before deploying.

vzdump: nightly-all
    schedule mon..sun 02:00
    enabled 1
    all 1
    storage local                                # or `main-backup` for PBS
    mode snapshot
    compress zstd
    mailnotification failure
    mailto admin@example.com
    prune-backups keep-last=3,keep-daily=7,keep-weekly=4,keep-monthly=6
    # Optional: namespace for PBS retention isolation
    # namespace prod
    # Optional: per-job notes
    notes-template "{{guestname}} {{vmid}} {{node}}"
