  - name: comp-spec
    status: mapped
    evidence: [script:comp_spec.py]

  - name: font-match
    status: mapped
    evidence: [script:fontindex.py]

  - name: build-phase
    status: mapped
    here: "`ux_phase.py` — seven stages, each transition machine-checked"
    evidence: [script:ux_phase.py, op:phase]

  - name: hook
    status: mapped
    here: "PostToolUse runs the static tier on every interface file as it is written"
    evidence: [op:hooks, script:ux_check.py, flag:ux_check.py:--stdin]

  - name: hook-before-edit
    status: mapped
    here: "PreToolUse asks the phase gate, so the refusal lands while the file is open"
    evidence: [op:hooks, script:ux_phase.py]

  - name: hook-admin
    status: mapped
    evidence: [op:hooks]

  - name: comp-diff
    status: partial
    here: "`ux_image.py verify` measures a comp against the contract, and the static
           and runtime tiers measure the build against the same contract, so both
           ends are bound to one declaration"
    gap: >-
      no direct comp-to-implementation pixel diff. Both artefacts are compared to
      the contract rather than to each other, which catches a build that left the
      system but not a build that matches the system and not the approved comp.
    evidence: [script:ux_image.py, sub:ux_image.py:verify, detector:S-CONTRACT-COLOR]

  - name: detect-csp
    status: partial
    here: >-
      the live page is measured instead of the project config: `cdp.style_policy`
      probes whether an injected stylesheet takes effect and says so rather than
      producing an overlay that is present and invisible, and the review proxy
      neutralises a `<meta http-equiv>` policy in the framed copy only
    gap: >-
      no static scan of the project's CSP configuration ahead of time, so a policy
      that will block the overlay is discovered when the overlay is injected rather
      than beforehand. Nothing here disables a page's policy.
    evidence: [script:cdp.py, script:ux_review.py, script:ux_select.py]

  - name: concept-seed
    status: partial
    here: "the wireframe round serves three options and records which was chosen,
           by whom, when, and against exactly which contract"
    gap: >-
      no rolling challenger against an already-chosen direction. A decision here is
      settled once and re-opened explicitly, not continuously contested.
    evidence: [script:ux_question.py, op:visualize, op:decide]

  - name: pin
    status: absent
    gap: >-
      pins one of their commands into the agent's menu. Every operation here is a
      plugin command and they are all present at once, so there is nothing to pin
      or unpin. No capability is missing; the mechanism has no subject.

  - name: skills
    status: absent
    gap: >-
      their installer for their own CLI (`install`, `link`, `update`, `check`).
      This ships as a skill and a plugin installed by `npx skills` and
      `claude plugin`, so there is no binary to link and no updater to run.

# ---------------------------------------------------------------------------
# 3. Live mode, subcommand by subcommand. This is where the real remaining gaps
#    are, and they are all the same gap: writing structure rather than values.
# ---------------------------------------------------------------------------
live:
  - name: live
    status: mapped
    here: "`ux_live.py pick`"
    evidence: [sub:ux_live.py:pick, op:live]

  - name: live-target
    status: mapped
    here: "`pick --describe` names the element instead of clicking it"
    evidence: [flag:ux_live.py:--describe]

  - name: live-status
    status: mapped
    evidence: [sub:ux_live.py:status]

  - name: live-resume
    status: mapped
    here: "a session is a file (`.deuxui/live/REQ-NNN.yaml`); any command naming that
           id resumes it, and `show` re-injects the switcher"
    evidence: [sub:ux_live.py:show, sub:ux_live.py:status]

  - name: live-complete
    status: mapped
    here: "`accept` closes a session with a decision record; `discard` closes it
           without one, and says that it does not revert the source"
    evidence: [sub:ux_live.py:accept, sub:ux_live.py:discard]

  - name: live-inject
    status: mapped
    here: "`show` puts every variant in the element's own position with a switcher"
    evidence: [sub:ux_live.py:show]

  - name: live-generate
    status: mapped
    here: "`vary` — declared values only, one axis per variant"
    evidence: [sub:ux_live.py:vary]

  - name: live-accept
    status: mapped
    here: "`accept` — checked before it is written, refused on a new P0 or P1,
           recorded with the contract hash it was decided against"
    evidence: [sub:ux_live.py:accept, script:ux_ledger.py]

  - name: live-server
    status: mapped
    here: "`ux_review.py serve` hosts or proxies the app and injects the overlay"
    evidence: [script:ux_review.py, sub:ux_review.py:serve]

  - name: live-poll
    status: mapped
    here: "notes land as files as they are typed and print in the terminal;
           `ux_select.py list` and `ux_live.py status` read the queue"
    evidence: [script:ux_select.py, sub:ux_select.py:list, sub:ux_live.py:status]

  - name: live-commit-manual-edits
    status: partial
    here: >-
      `ux_live.py text` rewrites the visible copy of a picked element in the source:
      the string must resolve to exactly one place by an anchor from the element
      itself, the edit is checked before it is written, and every other occurrence of
      the same literal — including a lookup key in an i18n catalogue — is reported
      and deliberately left alone
    gap: >-
      copy only, one element at a time, initiated from the terminal. Theirs batches
      edits typed directly into the page, leases the batch, and applies it through a
      dedicated subagent with chunking and repair. There is no in-page editing
      surface here and no batch protocol.
    evidence: [sub:ux_live.py:text, flag:ux_live.py:--to]

  - name: live-discard-manual-edits
    status: partial
    here: "nothing is staged, so there is nothing to discard: `text --dry-run` shows
           the diff and writes nothing"
    gap: >-
      follows from the row above. With no staged batch there is no discard verb; the
      equivalent of abandoning a batch is not running the command.
    evidence: [flag:ux_live.py:--dry-run]

  - name: live-wrap
    status: absent
    gap: >-
      wraps a picked element in new markup. This writes declared values and copy; it
      does not author or restructure JSX. Doing it properly needs per-framework
      source adapters of the kind their `crates/live` carries, and guessing at the
      component boundary would write a plausible edit to the wrong place — which
      still reads as success, the failure this whole write path exists to refuse.

  - name: live-insert
    status: absent
    gap: >-
      inserts a new element beside a picked one. Same reason as `live-wrap`: it is a
      structural edit, and the honest position is that it is not implemented rather
      than half-implemented.

# ---------------------------------------------------------------------------
# 4. Their subagents.
# ---------------------------------------------------------------------------
agents:
  - name: impeccable-finish-reviewer
    status: mapped
    here: "the `ux-reviewer` subagent — an independent assessment produced separately
           from the detector evidence so the findings do not anchor the review"
    evidence: [ref:references/workflows/audit.md]

  - name: impeccable-documenter
    status: partial
    here: "the `document` operation derives the contract from the shipped code"
    gap: >-
      runs in the main thread, not as a separate agent. The independence argument
      that justifies a separate reviewer does not obviously apply to recording what
      the code already says, but it is a difference and it is recorded as one.
    evidence: [op:document, script:derive_contract.py]

  - name: impeccable-asset-producer
    status: partial
    here: "`ux_image.py render` draws comps from the contract with no model or
           network; `generate` calls a provider; `comp_spec.py` reads a reference
           image back and records provenance in the PNG"
    gap: >-
      no production-cleanup pass over an approved mock — crops, contact sheets,
      raster ingredients for code to compose. Comps here are decision artefacts, not
      shipping assets.
    evidence: [script:ux_image.py, script:comp_spec.py]

  - name: impeccable-manual-edit-applier
    status: partial
    here: "`ux_live.py text` applies one copy edit, with the checks as the gate"
    gap: >-
      no leased batch protocol and no separate applier agent. See
      `live-commit-manual-edits`.
    evidence: [sub:ux_live.py:text]

# ---------------------------------------------------------------------------
# 5. What is here that is not there. Recorded for the same reason as the gaps:
#    a parity file that only lists deficits is as misleading as one that only
#    lists matches.
# ---------------------------------------------------------------------------
additional:
  - name: the rule registry
    what: >-
      235 rules with a severity, a cited normative basis and the detectors that
      adjudicate them, linted so no prose can cite a rule that does not exist and no
      detector can claim coverage nobody implemented.
    evidence: [ref:references/rules/registry.yaml, script:lint_rules.py]

  - name: NOT_RUN as a status
    what: >-
      a rule that was not checked reports NOT_RUN, never PASS, and an unchecked P0
      blocks a release audit. The report also audits itself: a PASS must name a
      detector that ran.
    evidence: [script:ux_report.py, ref:references/verification/evidence.md]

  - name: the phase gate
    what: >-
      seven stages with machine-checked transitions, wired to PreToolUse, refusing
      production UI edits until somebody has used a prototype and accepted it. The
      override is audited.
    evidence: [script:ux_phase.py, op:phase]

  - name: the design ledger
    what: >-
      contracts archived by content hash, so a decision's `contract_sha` resolves to
      the bytes that were declared at the time. An unresolvable reference is reported
      as a gap and never filled in from the present.
    evidence: [script:ux_ledger.py, op:ledger]

  - name: a working prototype
    what: >-
      generated from the contract — real states, a form that validates, a dialog that
      traps focus, an undo that works — so the second review stage is something a
      person can use rather than look at.
    evidence: [script:ux_proto.py, op:prototype]

  - name: native platforms
    what: >-
      38 iOS and Android rules with static detectors, and a driver for Simulator and
      emulator evidence that states plainly when a stub is not a phone.
    evidence: [script:ux_native.sh, script:native_conformance.py, op:ios, op:android]

  - name: the tiers prove themselves
    what: >-
      `selftest.py` asserts every check fires on a known-bad fixture and stays silent
      on a known-good one; `browsertest.py` requires each runtime probe's numbers to
      match the pixels the browser painted.
    evidence: [script:selftest.py, script:browsertest.py]
