# Parity against impeccable, as data rather than as a claim.
#
# The honest reason this file exists: "we have everything they have" is exactly the
# kind of sentence this skill was built to refuse anywhere else. It is unfalsifiable
# prose about coverage, which is the same shape as "looks good" about an interface.
# So the claim is written down one entry at a time, each with evidence that resolves
# to a file in this skill, and `scripts/parity.py` checks that every piece of
# evidence exists. A `mapped` row whose evidence does not resolve is a lint failure,
# not a rounding error.
#
# `status` is one of:
#   mapped   -- this skill does the same job. Evidence must resolve.
#   partial  -- part of the job. `gap` is REQUIRED and says which part is missing.
#   absent   -- not done here. `gap` is REQUIRED and says so plainly.
#
# A `partial` or `absent` with no `gap` fails the lint. That rule is the whole point:
# the failure mode being guarded against is a status quietly softening over time
# until the file reads as complete without anything having been built.
#
# Evidence kinds, all resolved inside this skill (never outside it, because a skill
# is copied away from this repo and has to be able to check itself):
#   op:<stem>          references/ops/<stem>.md
#   workflow:<stem>    references/workflows/<stem>.md
#   ref:<path>         any path under the skill
#   script:<name>      scripts/<name>
#   sub:<script>:<cmd> that script declares that subcommand
#   flag:<script>:<f>  that script declares that option
#   detector:<ID>      present in references/rules/detectors.yaml
#
# `parity.py --deep` additionally RUNS every cited script. Existing is not working: a
# row can cite a script that is present and broken, and the claim resolves while the
# capability does not. The shallow check already executes any script cited with a
# `sub:`, so what `--deep` adds is the 20 cited only as `script:` -- which it never ran.
#   hook:<event>       documented in references/ops/hooks.md

source:
  project: impeccable
  upstream: https://github.com/pbakaus/impeccable
  license: Apache-2.0
  cli_version: "4.0.0"
  read_on: "2026-09-21"
  read_from: >-
    a local clone of the upstream repository, kept outside git (see .gitignore) and
    not redistributed. Structure and command names are facts about a published
    tool; none of their prose, rule text or code is copied. See ../../NOTICE.md.
  enumerated_from:
    - crates/cli/src/main.rs           # the top-level command dispatch
    - crates/live/src/lib.rs           # the live-mode dispatch
    - skill/scripts/command-metadata.json   # the 24 user-facing commands
    - skill/SKILL.src.md               # their command table and categories
    - skill/reference/                 # 36 operation references
    - cursor-plugin/agents/            # 4 subagents
    - cursor-plugin/hooks/hooks.json   # their hook wiring
  counts:
    user_commands: 24
    cli_entry_points: 39
    reference_files: 36
    agents: 4

