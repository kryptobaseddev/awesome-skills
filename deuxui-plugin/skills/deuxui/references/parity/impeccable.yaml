# ---------------------------------------------------------------------------
# 2. The CLI. Their skill drives a Rust binary; this one drives Python scripts.
#    Several entries here are about their own distribution and have no analogue
#    because there is no binary to distribute — those are recorded as absent with
#    the reason, not quietly dropped.
# ---------------------------------------------------------------------------
cli:
  - name: detect
    status: mapped
    here: the static tier
    evidence: [script:ux_check.py]

  - name: engine-probe
    status: mapped
    here: "`doctor.py`, which also names what each unavailable engine costs in rules"
    evidence: [script:doctor.py]

  - name: ignores
    status: mapped
    here: "`exclude:` in the project config, read by the one config reader"
    evidence: [script:uxconfig.py, ref:assets/templates/ux.config.yaml]

  - name: context
    status: mapped
