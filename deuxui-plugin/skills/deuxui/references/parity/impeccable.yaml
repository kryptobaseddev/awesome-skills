# Parity against impeccable, as data rather than as a claim.
#
# The honest reason this file exists: "we have everything they have" is exactly the
# kind of sentence this skill was built to refuse anywhere else. It is unfalsifiable
# prose about coverage, which is the same shape as "looks good" about an interface.
# So the claim is written down one entry at a time, each with evidence that resolves
# to a file in this skill, and `scripts/parity.py` checks that every piece of
# evidence exists. A `mapped` row whose evidence does not resolve is a lint failure,
# not a rounding error.
#
# `status` is one of:
#   mapped   -- this skill does the same job. Evidence must resolve.
#   partial  -- part of the job. `gap` is REQUIRED and says which part is missing.
#   absent   -- not done here. `gap` is REQUIRED and says so plainly.
#
# A `partial` or `absent` with no `gap` fails the lint. That rule is the whole point:
# the failure mode being guarded against is a status quietly softening over time
# until the file reads as complete without anything having been built.
#
# Evidence kinds, all resolved inside this skill (never outside it, because a skill
# is copied away from this repo and has to be able to check itself):
#   op:<stem>          references/ops/<stem>.md
#   workflow:<stem>    references/workflows/<stem>.md
#   ref:<path>         any path under the skill
#   script:<name>      scripts/<name>
#   sub:<script>:<cmd> that script declares that subcommand
#   flag:<script>:<f>  that script declares that option
#   detector:<ID>      present in references/rules/detectors.yaml
#   hook:<event>       documented in references/ops/hooks.md

source:
  project: impeccable
  upstream: https://github.com/pbakaus/impeccable
  license: Apache-2.0
  cli_version: "4.0.0"
  read_on: "2026-09-21"
  read_from: >-
    a local clone of the upstream repository, kept outside git (see .gitignore) and
    not redistributed. Structure and command names are facts about a published
    tool; none of their prose, rule text or code is copied. See ../../NOTICE.md.
  enumerated_from:
    - crates/cli/src/main.rs           # the top-level command dispatch
    - crates/live/src/lib.rs           # the live-mode dispatch
    - skill/scripts/command-metadata.json   # the 24 user-facing commands
    - skill/SKILL.src.md               # their command table and categories
    - skill/reference/                 # 36 operation references
    - cursor-plugin/agents/            # 4 subagents
    - cursor-plugin/hooks/hooks.json   # their hook wiring
  counts:
    user_commands: 24
    cli_entry_points: 39
    reference_files: 36
    agents: 4

# ---------------------------------------------------------------------------
# 1. The 24 user-facing commands. This is the surface a person uses, and it is
#    the list the phrase "everything they have" most plausibly means.
# ---------------------------------------------------------------------------
commands:
  - name: adapt
    does: adapt a design to other screen sizes, devices, contexts or platforms
    status: mapped
    here: "the `adapt` operation"
    evidence: [op:adapt, op:adapt-native, detector:R-REFLOW, detector:R-TARGET-COARSE,
               detector:R-ZOOM, detector:R-TEXTSPACING, detector:R-ORIENTATION]

  - name: animate
    does: purposeful animation, micro-interaction and motion
    status: mapped
    here: "the `animate` operation, with the reduced-motion branch as a gate"
    evidence: [op:animate, detector:S-MOTION-REDUCE, detector:S-CONTRACT-MOTION,
               detector:S-CRAFT-EASING, detector:R-MOTION]

  - name: audit
    does: technical quality checks across accessibility, performance, responsive
    status: mapped
    here: "the `audit` workflow, over all tiers, ending in a gate decision"
    evidence: [workflow:audit, op:audit-native, script:ux_check.py, script:ux_report.py]

  - name: bolder
    does: amplify a safe or bland design
    status: mapped
    here: "the `bolder` operation"
    evidence: [op:bolder, detector:S-SLOP-GRADIENT, detector:S-CRAFT-HALO]

  - name: clarify
    does: improve UX copy, labels and error messages
    status: mapped
    here: "the `clarify` operation"
    evidence: [op:clarify, detector:S-CRAFT-VOICE]

  - name: colorize
    does: add strategic colour to a monochromatic UI
    status: mapped
    here: "the `colorize` operation, plus a generator that places roles against the
           contrast each one owes"
    evidence: [op:colorize, script:palette.py, detector:S-CONTRAST-PAIR]

  - name: craft
    does: "deprecated upstream: an alias for an ordinary new-work request"
    status: mapped
    here: "the `craft` reference is the detector floor; new work routes through
           `new-work` and the mode router"
    evidence: [op:craft, op:new-work, ref:references/design/craft-floor.md]

  - name: critique
    does: UX design review with heuristic scoring
    status: partial
    here: "the `critique` workflow, which reports findings against rule IDs"
    gap: >-
      no composite score. Deliberate, and the one place this skill refuses to copy
      them: a single number invites optimising the number, and it cannot express
      "four P2s and one unchecked P0", which is the distinction that decides whether
      something ships. The finding list and the gate decision replace it.
    evidence: [workflow:critique, script:ux_report.py]

  - name: delight
    does: personality and memorable touches
    status: mapped
    here: "the `delight` operation, bounded by the dark-pattern and emoji detectors"
    evidence: [op:delight, detector:S-SLOP-EMOJI, detector:S-DARK-PATTERN,
               detector:S-STATE-PREMATURE]

  - name: distill
    does: strip to essence, remove complexity
    status: mapped
    here: "the `distill` operation, which may not remove a recovery path"
    evidence: [op:distill]

  - name: document
    does: generate a DESIGN.md capturing the current visual system from the code
    status: mapped
    here: "the `document` operation, which writes the prose AND a machine-readable
           contract, because prose cannot be conformed to"
    evidence: [op:document, script:derive_contract.py,
               ref:assets/templates/design.contract.yaml]

  - name: extract
    does: pull repeated patterns and tokens into the design system
    status: mapped
    here: "the `extract` operation"
    evidence: [op:extract]

  - name: generate
    does: >-
      name an element and a direction in words, skip manual picking, and get N
      variants in the live browser to cycle and accept
    status: mapped
    here: "`ux_live.py pick --describe` resolves the element from words to exactly
           one node or refuses with the candidates; `vary --direction` builds the
           variants; `show` puts them in the element's own position"
    evidence: [op:generate, script:ux_live.py, flag:ux_live.py:--describe,
               flag:ux_live.py:--direction, sub:ux_live.py:show]

  - name: harden
    does: "production-ready: errors, i18n, edge cases"
    status: mapped
    here: "the `harden` workflow, with the states forced rather than inspected"
