  - name: build-phase
    status: mapped
    here: "`ux_phase.py` — seven stages, each transition machine-checked"
    evidence: [script:ux_phase.py, op:phase]

  - name: hook
    status: mapped
    here: "PostToolUse runs the static tier on every interface file as it is written"
    evidence: [op:hooks, script:ux_check.py, flag:ux_check.py:--stdin]

  - name: hook-before-edit
    status: mapped
    here: "PreToolUse asks the phase gate, so the refusal lands while the file is open"
    evidence: [op:hooks, script:ux_phase.py]

  - name: hook-admin
    status: mapped
    evidence: [op:hooks]

  - name: comp-diff
    status: mapped
    here: >-
      `comp_diff.py` compares the build to the comp that was approved, which is the
      gap `ux_image.py verify` cannot close: verify catches a build that left the
      system, not one that stayed inside it and is not the thing somebody chose.
      Deliberately not a pixel diff -- a comp is a fixed width, a screenshot is a
      viewport with real copy and real data, and aligning those produces a number that
      moves when nothing meaningful changed. It compares what each image is MADE OF:
      the palette weighted by coverage, the canvas and ink with the contrast measured
      between them, and the sequence of flat / mixed / photographic regions. It
      rasterises an SVG or HTML comp through the browser so it can consume this skill's
      own output, forces one viewport width on both captures, and states in every
      report that type, spacing, hierarchy and motion are not measured here.
      It refuses to compare colour against a WIREFRAME and says so: a rendered sheet
      settles structure and commits to nothing about colour, since its plate bands are
      hatched stand-ins for images nobody has chosen. That is the tool declining to
      produce a false result, not a capability it lacks -- colour comparison needs a
      generated or photographed comp.
    evidence: [script:comp_diff.py, script:comp_spec.py, script:ux_image.py,
               sub:ux_image.py:verify, detector:S-CONTRACT-COLOR]

  - name: detect-csp
    status: mapped
    here: >-
      both ends. `csp.py` scans the project for where a policy is DECLARED -- Next
      config and middleware, Nuxt, SvelteKit, Astro, Vite dev headers, vercel.json,
      netlify.toml, `_headers`, nginx, Caddy, and `<meta http-equiv>` in source -- and
      says per file whether it permits inline style, including the case where a nonce
      beside `'unsafe-inline'` makes browsers ignore the keyword. `cdp.style_policy`
      then measures the live page, which is the authoritative answer; the scan exists
      to name the file, because "your overlay will not be styled" is not actionable
      without one. `doctor.py` carries it as a row, `ux_select.py` prints it with its
      refusal, and `ux_review.py` neutralises a meta policy in the framed copy only.
      Nothing anywhere disables a page's policy: loosening one is the project's
      decision, in a file they own, for their dev configuration.
    evidence: [script:csp.py, script:cdp.py, script:ux_review.py, script:ux_select.py,
               script:doctor.py]

  - name: concept-seed
    status: partial
    here: "the wireframe round serves three options and records which was chosen,
           by whom, when, and against exactly which contract"
    gap: >-
      no rolling challenger against an already-chosen direction. A decision here is
      settled once and re-opened explicitly, not continuously contested.
    evidence: [script:ux_question.py, op:visualize, op:decide]

  - name: pin
    status: absent
    gap: >-
      pins one of their commands into the agent's menu. Every operation here is a
      plugin command and they are all present at once, so there is nothing to pin
      or unpin. No capability is missing; the mechanism has no subject.

  - name: skills
    status: absent
    gap: >-
      their installer for their own CLI (`install`, `link`, `update`, `check`).
      This ships as a skill and a plugin installed by `npx skills` and
      `claude plugin`, so there is no binary to link and no updater to run.

# ---------------------------------------------------------------------------
# 3. Live mode, subcommand by subcommand. This is where the real remaining gaps
#    are, and they are all the same gap: writing structure rather than values.
# ---------------------------------------------------------------------------
live:
  - name: live
    status: mapped
    here: "`ux_live.py pick`"
    evidence: [sub:ux_live.py:pick, op:live]

  - name: live-target
    status: mapped
    here: "`pick --describe` names the element instead of clicking it"
    evidence: [flag:ux_live.py:--describe]

  - name: live-status
    status: mapped
    evidence: [sub:ux_live.py:status]

  - name: live-resume
    status: mapped
    here: "a session is a file (`.deuxui/live/REQ-NNN.yaml`); any command naming that
           id resumes it, and `show` re-injects the switcher"
    evidence: [sub:ux_live.py:show, sub:ux_live.py:status]

  - name: live-complete
    status: mapped
    here: "`accept` closes a session with a decision record; `discard` closes it
           without one, and says that it does not revert the source"
    evidence: [sub:ux_live.py:accept, sub:ux_live.py:discard]

  - name: live-inject
    status: mapped
    here: "`show` puts every variant in the element's own position with a switcher"
    evidence: [sub:ux_live.py:show]

  - name: live-generate
    status: mapped
    here: "`vary` — declared values only, one axis per variant"
    evidence: [sub:ux_live.py:vary]

  - name: live-accept
    status: mapped
    here: "`accept` — checked before it is written, refused on a new P0 or P1,
           recorded with the contract hash it was decided against"
    evidence: [sub:ux_live.py:accept, script:ux_ledger.py]

  - name: live-server
    status: mapped
    here: "`ux_review.py serve` hosts or proxies the app and injects the overlay"
    evidence: [script:ux_review.py, sub:ux_review.py:serve]

  - name: live-poll
    status: mapped
    here: "notes land as files as they are typed and print in the terminal;
           `ux_select.py list` and `ux_live.py status` read the queue"
    evidence: [script:ux_select.py, sub:ux_select.py:list, sub:ux_live.py:status]

  - name: live-commit-manual-edits
    status: partial
    here: >-
      `ux_live.py edits watch` puts the editing where the reading happens: Alt-click
      any text in the running page and rewrite it in place. Each change is STAGED to
      `.deuxui/edits/`, never written -- what lands in the page is a DOM change that
      disappears on reload, because an in-page editor writing straight to disk would
      bypass every gate this skill has. `edits list` resolves each one to a source
      location; `edits apply --who NAME` writes the batch, running the static tier over
      it first and refusing on a new P0 or P1 (an error message rewritten to "Something
      went wrong" is refused by `S-CONTENT-ERRORTEXT`). Each edit resolves
      independently, so one refusal does not discard the rest, and a refused edit stays
      staged rather than being silently lost.
    gap: >-
      no lease and no chunking: one queue on one machine, not a protocol between
      processes. An element whose text spans more than one source string is refused
      rather than repaired -- `locate` matched a prefix, and where the new wording
      begins and ends is not established from here.
    evidence: [sub:ux_live.py:edits, sub:ux_live.py:text, flag:ux_live.py:--to,
               script:ux_select.py]

  - name: live-discard-manual-edits
    status: mapped
    here: >-
      `ux_live.py edits discard` drops the staged batch, and says plainly that there is
      nothing to revert because nothing had reached the source -- the page itself
      reloads clean.
    evidence: [sub:ux_live.py:edits]

  - name: live-wrap
    status: partial
    here: >-
      `ux_live.py wrap --with TAG [--attr ...]` wraps the picked element in a new one,
      re-indenting its source rather than reformatting it. The boundaries come from
      `jsxspan.py`, which scans with a state machine that knows about strings, template
      literals, both comment forms and brace depth inside a tag -- because every one of
      `onClick={() => x}`, `{a > b}`, `title="a > b"`, `useState<Row[]>`,
      `{/* <Legacy /> */}` and `// <Old />` is a `<` or `>` that is not a tag boundary.
      The span is verified before anything is written, and the DOM tag the browser
      reported has to agree with the tag found in source.
    gap: >-
      resolved textually, with no framework adapter and no AST, so it cannot follow a
      component boundary: an element rendered by `<Card title=.../>` resolves to the
      usage, never into `Card`'s own definition. It refuses rather than guesses -- an
      element located by its class instead of its text, a span whose tag disagrees with
      what was picked on screen, unbalanced boundaries, or an anchor appearing more than
      once each produce a refusal and no write.
      It does answer the question the adapter is usually wanted FOR: whether the markup
      runs once or once per row. `jsxspan.repeated` detects `.map()`, `.forEach()`,
      `.flatMap()`, a Svelte `{#each}`, and `v-for` / `*ngFor` / `x-for` /
      `ng-repeat`, and says so before the edit -- "wrapped the element" and "wrapped
      every row of the table" are different changes.
    evidence: [sub:ux_live.py:wrap, flag:ux_live.py:--with, script:jsxspan.py]

  - name: live-insert
    status: partial
    here: >-
      `ux_live.py insert --markup M --where before|after|prepend|append` places markup
      relative to the picked element at the right indentation, through the same span
      resolver. `prepend`/`append` refuse on a self-closing element, which has no
      inside. Markup the caller supplies is measured by the static tier before it is
      written and refused on a new P0 or P1 -- a clickable `div` is a finding whether
      this skill generated it or an agent typed it.
    gap: >-
      the same span-resolution limits as `live-wrap`, including the repeat notice.
      It also does not check HTML
      nesting validity: a `<p>` placed inside an `<h1>` lands where asked and no
      detector currently objects.
    evidence: [sub:ux_live.py:insert, flag:ux_live.py:--markup, script:jsxspan.py]

# ---------------------------------------------------------------------------
# 4. Their subagents.
# ---------------------------------------------------------------------------
agents:
  - name: impeccable-finish-reviewer
    status: mapped
    here: "the `ux-reviewer` subagent — an independent assessment produced separately
           from the detector evidence so the findings do not anchor the review"
    evidence: [ref:references/workflows/audit.md]

  - name: impeccable-documenter
    status: mapped
    here: >-
      the `ux-documenter` subagent. Runs `derive_contract.py` first and reads the spread
      beside each dominant value -- three radii at 8px and one at 9px is a scale with a
      typo, four evenly spread between 4 and 16 is not a scale at all -- then writes
      both `DESIGN.md` and the machine-readable contract, because prose cannot be
      conformed to and a DESIGN.md alone leaves every conformance rule NOT_RUN. It asks
      a person exactly two things, atmosphere and colour character, which are the only
      parts of a visual system that cannot be measured.
    evidence: [op:document, script:derive_contract.py, script:ux_ledger.py]

  - name: impeccable-asset-producer
    status: mapped
    here: >-
      the `ux-asset-producer` subagent, working from `comp_spec.py`'s measured region
      kinds rather than from what is convenient to build: a photographic region ships
      as a raster, a flat one ships as code, and writing CSS for a sculpted panel is
      the quiet deletion of the design somebody approved. It crops to content rather
      than layout, refuses baked-in text (A11Y-007, CONTENT-004), gives each asset an
      intrinsic ratio the markup can reserve, and records provenance INSIDE the PNG so
      the asset can be regenerated by somebody who was not in the room.
    evidence: [script:ux_image.py, script:comp_spec.py, flag:comp_spec.py:--provenance]

  - name: impeccable-manual-edit-applier
    status: partial
    here: >-
      `ux_live.py edits apply` applies a staged batch to the source, each edit resolved
      independently and the whole batch measured by the static tier before anything is
      written
    gap: >-
      runs in the main thread, not as a separate agent, and has no lease or chunk
      protocol. It also does not repair: an edit it cannot resolve to exactly one
      source string is refused with the reason and left staged, where theirs attempts
      a repair pass.
    evidence: [sub:ux_live.py:edits]

# ---------------------------------------------------------------------------
# 5. What is here that is not there. Recorded for the same reason as the gaps:
#    a parity file that only lists deficits is as misleading as one that only
#    lists matches.
# ---------------------------------------------------------------------------
additional:
  - name: the rule registry
    what: >-
      235 rules with a severity, a cited normative basis and the detectors that
      adjudicate them, linted so no prose can cite a rule that does not exist and no
      detector can claim coverage nobody implemented.
    evidence: [ref:references/rules/registry.yaml, script:lint_rules.py]

  - name: NOT_RUN as a status
    what: >-
      a rule that was not checked reports NOT_RUN, never PASS, and an unchecked P0
      blocks a release audit. The report also audits itself: a PASS must name a
      detector that ran.
    evidence: [script:ux_report.py, ref:references/verification/evidence.md]

  - name: the phase gate
    what: >-
      seven stages with machine-checked transitions, wired to PreToolUse, refusing
      production UI edits until somebody has used a prototype and accepted it. The
      override is audited.
    evidence: [script:ux_phase.py, op:phase]

  - name: the design ledger
    what: >-
      contracts archived by content hash, so a decision's `contract_sha` resolves to
      the bytes that were declared at the time. An unresolvable reference is reported
      as a gap and never filled in from the present.
    evidence: [script:ux_ledger.py, op:ledger]

  - name: a working prototype
    what: >-
      generated from the contract — real states, a form that validates, a dialog that
      traps focus, an undo that works — so the second review stage is something a
      person can use rather than look at.
    evidence: [script:ux_proto.py, op:prototype]

  - name: native platforms
    what: >-
      38 iOS and Android rules with static detectors, and a driver for Simulator and
      emulator evidence that states plainly when a stub is not a phone.
    evidence: [script:ux_native.sh, script:native_conformance.py, op:ios, op:android]

  - name: two records, resolved with evidence rather than a guess
    what: >-
      when a project has two state directories -- an older version was run, a checkout
      is shared, a directory was copied -- only one is read and everything in the other
      is silently ignored. `migrate --compare` prints what distinguishes them, weighting
      archived contract versions and decisions over file dates, because a scaffold can
      be newer than a history. `migrate --adopt` MOVES the one you are not keeping and
      writes a `SET-ASIDE.md` into it saying how to put it back; nothing is deleted and
      no bytes are rewritten, so every `contract_sha` still resolves either way.
    evidence: [script:ux_ledger.py, sub:ux_ledger.py:migrate, flag:ux_ledger.py:--adopt,
               flag:ux_ledger.py:--compare, op:ledger]

  - name: where a CSP is declared, and what it forbids
    what: >-
      `csp.py` reads the policy out of eleven declaration sites and answers one
      question precisely: will an injected stylesheet apply. It handles the case that
      catches people out -- a nonce or hash beside `'unsafe-inline'` voids the keyword
      -- and it refuses to answer when a file declares the same directive twice with
      different values, because merging them would answer confidently about a policy
      that is not in force.
    evidence: [script:csp.py, script:selftest.py]

  - name: verified element spans
    what: >-
      `jsxspan.py` establishes an element's exact source boundaries and refuses when it
      cannot. Fifteen positive cases and four refusals are held by `selftest.py`, and
      each of the six mechanisms it depends on was verified to fail that control when
      removed. Three of the control cases did not discriminate when first written --
      they passed with the mechanism deleted -- and were replaced rather than kept.
    evidence: [script:jsxspan.py, script:selftest.py]

  - name: the tiers prove themselves
    what: >-
      `selftest.py` asserts every check fires on a known-bad fixture and stays silent
      on a known-good one; `browsertest.py` requires each runtime probe's numbers to
      match the pixels the browser painted.
    evidence: [script:selftest.py, script:browsertest.py]
