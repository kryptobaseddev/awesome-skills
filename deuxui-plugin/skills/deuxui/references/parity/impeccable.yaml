  - name: init
    does: capture durable product context, pre-configure live mode, recommend next
    status: mapped
    here: "the `init` workflow plus the phase record it starts"
    evidence: [workflow:init, script:ux_phase.py, ref:assets/templates/PRODUCT.md]

  - name: layout
    does: fix spacing, rhythm and visual hierarchy
    status: mapped
    here: "the `layout` operation, priority stated before arrangement"
    evidence: [op:layout, detector:S-CRAFT-RHYTHM, detector:R-REFLOW,
               detector:M-JUDGE-CONTENT-PRIORITY]

  - name: live
    does: pick elements in the browser and iterate on alternatives via HMR
    status: partial
    here: "`ux_live.py` — pick, vary, show in place, accept into the source, and
