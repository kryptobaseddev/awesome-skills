  - name: quieter
    does: tone down an aggressive or overstimulating design
    status: mapped
    here: "the `quieter` operation"
    evidence: [op:quieter]

  - name: shape
    does: plan UX/UI before writing code
    status: mapped
    here: "the `shape` operation, which returns a brief and writes no code"
